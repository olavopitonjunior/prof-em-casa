[project]
name = "prof-em-casa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["services/backend", "tests/domain"]
testpaths = ["tests"]
markers = [
    "ac(*ids): critério de aceite (AC-xx) que o teste comprova; ver tests/ac_traceability.py",
    "acceptance: jornada de aceite que parte de new_session e usa só apply_command",
]

[tool.ruff]
line-length = 100
