[project]
name = "tutor-divisao"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["services/backend", "tests/domain"]
testpaths = ["tests"]
markers = [
    "ac(*ids): critério de aceite (AC-xx) que o teste comprova; ver tests/ac_traceability.py",
    "acceptance: jornada de aceite que parte de new_session e usa só apply_command",
]

[tool.ruff]
line-length = 100
