[project]
name = "tutor-divisao"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["services/backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
